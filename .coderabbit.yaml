# CodeRabbit Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: "es" # Reviews en español
early_access: false
reviews:
  profile: "chill" # Opciones: chill, assertive, pythonic
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"

chat:
  auto_reply: true

# Archivos a ignorar en el review
ignore:
  - "**/*.md"
  - "**/*.lock"
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - ".next/**"
  - "node_modules/**"
  - "public/**"
  - "*.config.js"
  - "*.config.ts"
