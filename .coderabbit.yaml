# CodeRabbit Configuration
# https://docs.coderabbit.ai/reference/configuration

language: "es" # Reviews en español
early_access: false
reviews:
  profile: "chill" # Opciones: chill, assertive, pythonic
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  checks:
    docstring_coverage:
      mode: off # Desactivar verificación de docstrings
  auto_review:
    enabled: true
    auto_incremental_review: true
    base_branches:
      - ".*" # Revisar TODAS las ramas, no solo main
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
  path_filters:
    - "!**/*.md"
    - "!**/*.lock"
    - "!package-lock.json"
    - "!yarn.lock"
    - "!pnpm-lock.yaml"
    - "!.next/**"
    - "!node_modules/**"
    - "!public/**"
    - "!*.config.js"
    - "!*.config.ts"

chat:
  auto_reply: true
